*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,sans-serif;padding:16px;max-width:760px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{margin:0;font-size:20px}
.date{color:var(--mu);font-size:12px}
.cnt{text-align:right;flex:1;max-width:260px}
.cnt b{font-size:13px}.cnt small{color:var(--mu);float:right}
.bar{height:6px;background:#1c2a28;border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
nav{display:flex;gap:4px;margin:16px 0 12px;overflow-x:auto}
nav button{background:none;border:0;border-radius:99px;padding:8px 16px;color:var(--mu);white-space:nowrap}
nav button.on{background:var(--tx);color:#10201d;font-weight:600}
nav .n{background:#233430;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#0f1a18;border-radius:99px;padding:6px 14px;font-weight:600;font-size:12px}
.chip.on{background:var(--teal);color:#06231d;border-color:var(--teal)}
select,input[type=text]{background:#0f1a18;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12px}
.me input{width:130px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:8px}
.lead h2{margin:0;font-size:15px;letter-spacing:.2px}
.sub{color:var(--mu);font-size:12px;margin-top:3px}
.tag{background:#14403a;color:var(--teal);border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600;margin-left:4px}
.st{background:#243230;border-radius:99px;padding:3px 10px;font-size:11px;height:fit-content;white-space:nowrap}
.phone{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.num{background:#0f3a35;border-radius:8px;padding:10px 14px;font:600 17px ui-monospace,Consolas,monospace;color:var(--tx);text-decoration:none;letter-spacing:1px}
.sm{background:#0f1a18;border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:12px;font-weight:600}
.sm.wa{color:var(--green);border-color:var(--green)}
.lbl{color:var(--mu);font-size:11px;font-weight:700;letter-spacing:.8px;margin:12px 0 6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.o{background:transparent;border:1px solid;border-radius:9px;padding:12px 6px;font-weight:600;font-size:13px}
.o.on{background:currentColor}.o.on span{color:#0d1514}
.c-g{color:#a9b8b4;border-color:#3b4a46}.c-a{color:var(--amber);border-color:#7a5a1e;background:#2a2112}
.c-r{color:var(--red);border-color:#7a2f27;background:#2b1513}.c-r2{color:var(--red);border-color:#8a3a30;background:#3a1a16}
.n-g{color:var(--green);border-color:#2f8a5b;background:#10261d}.n-b{color:var(--blue);border-color:#2f4f8a;background:#121d33}
.o.on{filter:brightness(1.0);outline:2px solid currentColor;outline-offset:1px}
.o.on span{color:inherit}
textarea{width:100%;min-height:62px;background:#0f1a18;border:1px solid var(--line);border-radius:9px;padding:10px;resize:vertical;margin-top:12px}
.em{width:100%;margin-bottom:4px}
.src{text-align:right;color:var(--mu);font-size:11px;margin-top:8px}.src a{color:var(--blue)}
.empty,.box{color:var(--mu);text-align:center;padding:30px 12px;border:1px dashed var(--line);border-radius:12px}
.box{text-align:left;color:var(--tx);background:var(--card);border-style:solid;margin-bottom:12px;padding:16px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:480px;max-height:85vh;overflow:auto}
.modal p{margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stats b{font-size:24px;display:block}
.bk{margin-left:auto;background:var(--teal);color:#06231d!important;font-weight:700;border:0;border-radius:99px;padding:8px 16px;white-space:nowrap}
@media(max-width:520px){.me{margin-left:0;width:100%}}
</style>

function zipStore(files){const te=new TextEncoder(),parts=[],cen=[];let off=0;

  const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0)]);
  parts.push(lh,nb,d);
  cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
  off+=lh.length+nb.length+d.length});

 const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
 const all=[...parts,...cen,end],out=new Uint8Array(all.reduce((t,a)=>t+a.length,0));let p=0;all.forEach(a=>{out.set(a,p);p+=a.length});return out}

  h+=list.length?list.map(card).join(""):`<div class="empty">${tab==="fu"?"Abhi koi follow-up nahi.":"Is filter mein koi lead nahi."}</div>`;
 }
 if(tab==="prod")h=GROUPS.map(g=>`<div class="lbl" style="margin-top:18px;font-size:13px">${GLBL[g]}</div>`+ALLP.filter(p=>p[0]===g).map(([,a,b])=>`<div class="box"><b>${a}</b><div class="sub">${b}</div></div>`).join("")).join("");
 if(tab==="rep"){
  const c=k=>all.filter(l=>L(l.id).res===k).length,n=k=>all.filter(l=>L(l.id).next===k).length;
  h=`<div class="stats"><div><b>${calls}</b>Aaj ke calls</div><div><b>${all.filter(l=>L(l.id).res).length}</b>Total calls</div><div><b>${c("uthaya")}</b>Uthaya nahi</div><div><b>${c("busy")}</b>Busy</div><div><b>${c("no")}</b>Interested nahi</div><div><b>${n("interest")}</b>Interested</div><div><b>${n("quote")}</b>Quote bheja</div><div><b>${n("demo")}</b>Demo / meeting</div><div><b>${n("won")}</b>Deal ho gayi</div></div>
  <p style="margin-top:16px"><label class="sub">Daily target <input type="text" style="width:60px" value="${S.target}" onchange="S.target=+this.value||40;save();render()"></label>
  <button class="sm" onclick="if(confirm('Saara data reset karna hai?')){S={leads:{},name:S.name,target:S.target};save();render()}">Reset</button></p>`;
 }
 if(tab==="rep"){const have=LEADS.filter(l=>(L(l.id).email||"").trim()).length;h+=`<div class="box" style="margin-top:16px"><b>Emails ek saath daalo</b> <span class="sub">(abhi ${have} / ${LEADS.length} companies ka email hai)</span><div class="sub" style="margin:6px 0">Har line mein company ka naam (ya phone number) aur email, comma se alag. Jaise:<br>SSA Architects, info@ssaarchitects.com<br>+91 99670 33533, contact@collaborativearchitecture.com</div><textarea id="bulk" placeholder="Company naam, email"></textarea><button class="sm" onclick="importEmails()">Emails jodo</button></div>`}
if(tab==="rep"){const qv=LEADS.reduce((t,l)=>t+(parseFloat(String(L(l.id).qa||"").replace(/[^\d.]/g,""))||0),0),qn=LEADS.filter(l=>L(l.id).qa).length;h+=`<div class="box" style="margin-top:16px"><b>Quote pipeline</b>: Rs ${qv.toLocaleString("en-IN")} <span class="sub">(${qn} quotes, amount "Quote bheja / Demo / Deal ho gayi" wale card mein bharo)</span></div><div class="box"><b>Product interest</b><div class="sub" style="margin-top:6px">${ALLP.map(p=>[p[1],LEADS.filter(l=>PR(l).includes(p[1])).length]).filter(x=>x[1]).map(x=>x[0]+": "+x[1]).join(" · ")||"Abhi kisi lead pe product tag nahi hai."}</div></div><div class="box"><b>Backup aur CSV</b><div class="sub" style="margin:6px 0">Backup mein aapka sab data save hota hai: results, notes, emails, follow-ups aur naye leads.</div><button class="sm" onclick="xlAll()">Excel backup (sab kuch)</button> <button class="sm" onclick="backup()">Backup download</button> <label class="sm" style="display:inline-block">Backup restore<input type="file" accept=".json" hidden onchange="restore(this)"></label> <button class="sm" onclick="csvOut()">CSV export</button> <label class="sm" style="display:inline-block">CSV import<input type="file" accept=".csv" hidden onchange="csvIn(this)"></label><div class="sub" style="margin-top:6px">CSV import: pehli row mein Company, Phone, Email, City, Area, Type, Category jaise column naam rakho. Same phone wale duplicate chhod diye jaate hain.</div></div>`}
$("#view").innerHTML=h;
}
$("#date").textContent=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
render();
</script>
